<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korea Badges — collect them all</title>
<meta name="description" content="Collect pixel badges for 61 places in Korea. Track where you've been and share your map.">
<meta property="og:title" content="Korea Badges — collect them all">
<meta property="og:description" content="Pixel badges for Seoul's 10 districts and 51 destinations across Korea.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f5f2ea; --card:#fffdf8; --ink:#23211d; --muted:#77716a; --line:#e3ddd1; --accent:#c0392b; --gold:#d9a521; --ok:#2f7a4b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: "Inter", "Noto Sans KR", system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.55; }
  html[lang="ko"] body { word-break: keep-all; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 18px 60px; }
  .pixel { font-family: "Press Start 2P", "Noto Sans KR", monospace; letter-spacing: .02em; }
  header.top { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; gap: 10px; }
  .logo { font-size: 13px; text-decoration: none; color: inherit; display: flex; gap: 8px; align-items: center; }
  .top-right { display: flex; gap: 8px; align-items: center; }
  .top-right a { font-size: 13px; color: var(--muted); text-decoration: none; }
  .lang { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 3px; }
  .lang button { border: 0; background: none; padding: 5px 11px; border-radius: 99px; cursor: pointer; font: 500 12.5px inherit; color: var(--muted); font-family: inherit; }
  .lang button.on { background: var(--ink); color: #fff; }

  .hero { background: #23211d; color: #f5f2ea; border-radius: 6px; padding: 24px; box-shadow: 0 0 0 4px #23211d, 0 0 0 8px var(--gold); margin: 12px 4px 30px; }
  .hero .label { font-size: 10px; color: var(--gold); }
  .hero h1 { font-size: clamp(18px, 4.4vw, 26px); margin: 12px 0 14px; line-height: 1.4; }
  .count { font-size: 12px; color: #cfc8ba; margin-bottom: 10px; }
  .bar { height: 16px; background: #3a3732; border-radius: 2px; overflow: hidden; display: flex; }
  .bar span { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--gold) 0 10px, #e9bd45 10px 12px); transition: width .5s steps(12); }
  .next { font-size: 12.5px; color: #cfc8ba; margin-top: 10px; }
  .hero .row { margin-top: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn { appearance: none; border: 0; cursor: pointer; font: 600 14px "Inter", "Noto Sans KR", sans-serif; padding: 11px 16px; border-radius: 4px; background: var(--accent); color: #fff; box-shadow: 0 4px 0 #7a2216; transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a2216; }
  .btn.gold { background: var(--gold); color: #23211d; box-shadow: 0 4px 0 #8a6a12; }
  .btn.ghost { background: transparent; color: inherit; border: 1.5px solid currentColor; box-shadow: none; }
  .btn.ok { background: var(--ok); box-shadow: 0 4px 0 #1d4e30; }

  .viewing { background: #fff6dc; border: 2px dashed var(--gold); border-radius: 6px; padding: 12px 14px; margin-bottom: 18px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }

  section.region { margin-bottom: 30px; }
  .rhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
  .rhead h2 { font-size: 13px; margin: 0; }
  .rhead .rc { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rhead .done { font-size: 9px; background: var(--gold); color: #23211d; padding: 4px 6px; border-radius: 2px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px 8px; }
  .badge { background: none; border: 0; padding: 4px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; color: inherit; border-radius: 6px; }
  .badge:hover { background: rgba(0,0,0,.04); }
  .badge:focus-visible { outline: 2px solid var(--accent); }
  .badge canvas { width: 80px; height: 80px; image-rendering: pixelated; }
  .badge .bn { font-size: 13px; font-weight: 600; text-align: center; line-height: 1.3; }
  .badge .bt { font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.3; }
  .badge.locked .bn { color: var(--muted); }
  .badge.pop canvas { animation: pop .45s steps(6); }
  @keyframes pop { 0% { transform: scale(.6) rotate(-8deg); } 50% { transform: scale(1.25) rotate(4deg); } 100% { transform: scale(1); } }

  .bonus { font-size: 7px; background: var(--gold); color: #23211d; padding: 2px 3px; border-radius: 2px; vertical-align: 2px; }
  .sheet .soon { font-size: 12.5px; color: var(--muted); margin: 12px 0 0; }
  dialog { border: 0; padding: 0; border-radius: 8px; width: min(420px, 92vw); background: var(--card); color: var(--ink); box-shadow: 0 0 0 4px var(--ink), 0 20px 60px rgba(0,0,0,.35); }
  dialog::backdrop { background: rgba(35,33,29,.55); }
  .sheet { padding: 22px; text-align: center; }
  .sheet canvas { width: 160px; height: 160px; image-rendering: pixelated; }
  .sheet .stitle { font-size: 13px; margin: 12px 0 6px; line-height: 1.5; }
  .sheet .splace { font-size: 18px; font-weight: 700; margin: 0; }
  .sheet .sdo { font-size: 14px; color: #4d4943; margin: 10px 0 16px; text-align: left; background: #f3efe6; padding: 10px 12px; border-radius: 4px; }
  .sheet .sdo b { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .sheet .when { font-size: 12.5px; color: var(--ok); margin: -6px 0 12px; }
  .sheet .links { display: flex; justify-content: center; gap: 14px; margin-top: 14px; font-size: 13px; }
  .sheet .links a { color: var(--accent); }
  .sheet .close { position: absolute; top: 8px; right: 10px; background: none; border: 0; font-size: 20px; cursor: pointer; color: var(--muted); }

  .toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) translateY(-30px); background: #23211d; color: #fff; padding: 12px 16px; border-radius: 4px; box-shadow: 0 0 0 3px var(--gold); font-size: 13.5px; opacity: 0; transition: all .25s; pointer-events: none; z-index: 20; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .pixel { font-size: 10px; color: var(--gold); display: block; margin-bottom: 4px; }
  footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 30px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo pixel" href="./">🏅 KOREA BADGES</a>
    <div class="top-right">
      <a href="../" id="plannerLink">🧭 Planner</a>
      <div class="lang"><button data-l="en">EN</button><button data-l="ko">한국어</button></div>
    </div>
  </header>

  <div id="viewing" class="viewing hidden"></div>

  <section class="hero">
    <div class="label pixel" id="rankLabel">RANK</div>
    <h1 class="pixel" id="rankName"></h1>
    <div class="count" id="count"></div>
    <div class="bar"><span id="bar" style="width:0"></span></div>
    <div class="next" id="next"></div>
    <div class="row">
      <button class="btn gold" id="saveImg"></button>
      <button class="btn ghost" id="copyLink"></button>
    </div>
  </section>

  <main id="regions"></main>
  <footer id="footer"></footer>
</div>

<dialog id="sheet"><div class="sheet" id="sheetBody" style="position:relative"></div></dialog>
<div class="toast" id="toast"></div>

<script src="icons.js"></script>
<script src="data.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
